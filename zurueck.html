<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Zurück-Knopf der Apps: führt dorthin, woher man gekommen ist.
     Lehrpersonen zur App-Übersicht, Kinder zu ihrer Klassenseite. Speichert nichts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zurück – eduapps.ch</title>
<style>body{margin:0;background:#fdf0dc;color:#2b2342;font:18px Verdana,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}a{color:#2b2342;font-weight:700}</style>
</head>
<body>
<p><a href="./" id="ziel">Zurück zu eduapps.ch</a></p>
<script>
(function(){
  var woher = '';
  try { woher = sessionStorage.getItem('eduapps.woher') || ''; } catch(e){}
  var ziel = woher === 'klasse' ? 'klasse.html' : './#apps';
  document.getElementById('ziel').href = ziel;
  location.replace(ziel);
})();
</script>
</body>
</html>
